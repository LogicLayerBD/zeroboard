# Publishes a GitHub release when a version tag (e.g. v1.0.0) is pushed.
# The binary is built on Ubuntu 22.04 so it runs on glibc 2.35+ (Ubuntu 22.04+, Debian 12+).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Queries are checked against the committed backend/.sqlx cache, not a live database.
      SQLX_OFFLINE: "true"
      ASSET: zeroboard-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          version="$(grep -m1 '^version' backend/Cargo.toml | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match backend/Cargo.toml version v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Lines between "## [VERSION]" and the next "## [", minus link reference lines.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build frontend
        run: make frontend

      - name: Frontend checks
        working-directory: frontend
        run: npm run check && npm test

      - name: Backend tests
        working-directory: backend
        run: cargo test --locked

      - name: Build release binary
        working-directory: backend
        run: cargo build --release --locked

      - name: Package
        run: |
          cp backend/target/release/zeroboard "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          ls -lh "$ASSET"
          cat "$ASSET.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" \
            --title "ZeroBoard $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
